spring:
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 1. 改成了你的数据库名 ai_creative_workshop
    url: jdbc:mysql://localhost:3306/ai_creative_workshop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 2. 改成了你本地的 MySQL 账号密码（线上环境请务必换回专用的低权限账号）
    username: root
    password: ${MYSQL_PASSWORD:123456}
  # redis
  data:
    redis:
      host: localhost # 原为 <Your IP>，如果你是本机测试，改成 localhost 即可
      port: 6379
      database: 0
      password: # 你之前的 yml 没写密码，如果是空密码就留空；如果有密码填上
      ttl: 3600

# AI 大模型配置（目前是 DeepSeek 和 阿里云通义千问）
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <your-api-key> # 需要去 DeepSeek 开放平台申请
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <your-api-key>
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: false
      log-responses: false
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <your-api-key>
      model-name: deepseek-chat
      max-tokens: 8192
      temperature: 0.1
      log-requests: false
      log-responses: false
    # 智能路由 AI 模型配置
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <your-api-key> # 阿里云百炼/通义千问的 API Key
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: false
      log-responses: false

# 添加 COS 对象存储配置（需要从腾讯云获取）
# 如果暂时没用到截图上传功能，可以先将这里注释掉，或者留空
cos:
  client:
    host: <your-custom-domain.com>
    secretId: <your-secret-id>
    secretKey: <your-secret-key>
    region: <your-region>
    bucket: <your-bucket-name>

# 阿里云 DashScope 配置（用于文生图）
dashscope:
  api-key: <your-api-key> # 阿里云百炼的 API Key
  image-model: wan2.2-t2i-flash

# Pexels 图片搜索配置（用于搜图）
pexels:
  api-key: <your-api-key>

# 生产环境关闭日志（本地调试建议打开，线上再关）
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 本地开发建议用这个打印 SQL；线上再改成 ''

# 接口文档配置（Knife4j 的密码保护）
knife4j:
  basic:
    enable: true
    username: root
    password: 123456

# 部署路径
code:
  deploy-host: http://<Your IP>/dist